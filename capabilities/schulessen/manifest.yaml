id: schulessen
class: tool
image: selu-cap-schulessen:latest

tools:
  - name: get_menu
    description: >
      Get the live school lunch menu for a date range. Returns meals grouped by
      day with closure reasons, deadlines and effective can_order. A closed day
      must not be presented as a meal offer, even if a menu is listed.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        from_date:
          type: string
          description: "Start date in YYYY-MM-DD format. Defaults to today in Europe/Berlin."
        to_date:
          type: string
          description: "End date in YYYY-MM-DD format. Defaults to Friday, or the start day on weekends. Maximum range 93 days."
        include_inactive:
          type: boolean
          description: "Include meals that are listed but not currently active. Default false."
      required: []
    recommended_policy: allow

  - name: get_cart
    description: >
      Get the current schulessen.net shopping cart or order overview. Useful
      before placing or cancelling a lunch order. The result separates active
      confirmed orders, pending changes, unknown status and settled cancellations.
      Use this tool before claiming anything is or is not ordered.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        from_date:
          type: string
          description: "Start date in YYYY-MM-DD format. Defaults to today in Europe/Berlin."
        to_date:
          type: string
          description: "End date in YYYY-MM-DD format. Defaults to Friday, or the start day on weekends. Maximum range 93 days."
      required: []
    recommended_policy: allow

  - name: place_order
    description: >
      Place a lunch order only when the live menu has can_order=true. Rechecks
      the checkout window for pending changes and verifies the final order.
      Never automatically retry an uncertain write.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          description: "School day in YYYY-MM-DD format."
        meal_id:
          type: integer
          minimum: 1
          description: "Meal or menu line ID from get_menu."
        quantity:
          type: integer
          minimum: 1
          description: "How many portions to order. Default 1."
        outlet_slot_id:
          type: integer
          minimum: 1
          description: "Outlet slot ID. Defaults to 1."
        allow_checkout_existing_cart:
          type: boolean
          description: "Allow checkout even if the cart already contains other items. Default false."
        components:
          type: array
          description: "Optional component selections required by some meals."
          items:
            type: object
      required:
        - date
        - meal_id
    recommended_policy: ask

  - name: cancel_order
    description: >
      Cancel a confirmed lunch order. Refuses pre-existing pending cart changes.
      Requires the date and meal ID; transaction ID is optional but recommended.
      Verifies cancellation; never automatically retry an uncertain result.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          description: "School day in YYYY-MM-DD format."
        meal_id:
          type: integer
          minimum: 1
          description: "Meal or menu line ID to cancel."
        transaction_id:
          type: string
          description: "Exact transaction ID from get_cart. Optional if the tool can resolve it unambiguously."
      required:
        - date
        - meal_id
    recommended_policy: ask

network:
  mode: allowlist
  hosts:
    - "www.schulessen.net:443"

filesystem: temp

credentials:
  - name: USERNAME
    scope: user
    required: true
    description: "schulessen.net username or card number"
  - name: PASSWORD
    scope: user
    required: true
    description: "schulessen.net password"

resources:
  max_memory_mb: 128
  max_cpu_fraction: 0.5
  max_cpu_seconds: 30
  pids_limit: 64
